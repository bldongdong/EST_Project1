<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="하루 5분 자격증 퀴즈 로그인 및 회원가입" />
    <title>로그인 | 하루 5분 자격증 퀴즈</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <script src="js/theme.js"></script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="auth">
    <canvas class="webgl-background" id="webgl-background" aria-hidden="true"></canvas>
    <main class="page-shell auth-page">
      <section class="card auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">하루 5분 자격증 퀴즈</p>
        <h1 id="auth-title">다시 만나서 반가워요!</h1>
        <p class="auth-lead" id="auth-lead">로그인하고 오늘의 7문제를 시작해 보세요.</p>

        <div class="auth-tabs" role="tablist" aria-label="인증 방식 선택">
          <button class="auth-tab is-active" id="login-tab" type="button" role="tab" aria-selected="true" data-auth-mode="login">
            로그인
          </button>
          <button class="auth-tab" id="signup-tab" type="button" role="tab" aria-selected="false" data-auth-mode="signup">
            회원가입
          </button>
        </div>

        <form class="auth-form" id="auth-form" novalidate>
          <div class="form-field">
            <label for="auth-email">이메일</label>
            <input id="auth-email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
          </div>
          <div class="form-field">
            <label for="auth-password">비밀번호</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상 입력해 주세요" required />
          </div>

          <p class="auth-message" id="auth-message" role="alert" aria-live="polite" hidden></p>
          <button class="button button-primary button-full" id="auth-submit" type="submit">로그인</button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/auth-ui.js"></script>
    <script type="module" src="js/background.js"></script>
  </body>
</html>
