<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="선택한 자격증의 필기 예상문제 풀이" />
    <title>오늘의 퀴즈 | 하루 5분 자격증 퀴즈</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="quiz" data-auth-protected="true">
    <canvas class="webgl-background" id="webgl-background" aria-hidden="true"></canvas>
    <main class="page-shell quiz-page">
      <section class="card quiz-card" aria-labelledby="question-title">
        <div class="account-bar">
          <a class="home-link" href="index.html" aria-label="메인 화면으로 이동">
            <span aria-hidden="true">←</span> 홈
          </a>
          <span class="account-email" data-auth-email></span>
          <button class="logout-button" type="button" data-logout>로그아웃</button>
        </div>
        <p class="account-auth-message" data-auth-message role="alert" hidden></p>
        <header class="quiz-header">
          <div>
            <p class="eyebrow" id="quiz-exam-name">오늘의 퀴즈</p>
            <p class="progress-text" id="progress-text">1 / 7</p>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="퀴즈 진행률"
            aria-valuemin="1"
            aria-valuemax="7"
            aria-valuenow="1"
          >
            <span class="progress-bar" id="progress-bar"></span>
          </div>
        </header>

        <form id="quiz-form">
          <fieldset class="question-fieldset" id="answer-fieldset">
            <legend class="question-title" id="question-title"></legend>
            <div class="option-list" id="option-list"></div>
          </fieldset>

          <button class="button button-primary button-full" id="submit-answer" type="submit" disabled>
            다음 문제
          </button>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mock-questions.js"></script>
    <script src="js/app.js"></script>
    <script type="module" src="js/background.js"></script>
  </body>
</html>
