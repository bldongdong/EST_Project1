<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="하루 7문제로 준비하는 자격증 필기시험"
    />
    <title>하루 5분 자격증 퀴즈</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="home" data-auth-protected="true">
    <canvas class="webgl-background" id="webgl-background" aria-hidden="true"></canvas>
    <main class="page-shell home-page">
      <section class="card home-card" aria-labelledby="service-title">
        <div class="account-bar account-bar-home">
          <span class="account-email" data-auth-email></span>
          <button class="logout-button" type="button" data-logout>로그아웃</button>
        </div>
        <p class="account-auth-message" data-auth-message role="alert" hidden></p>
        <img
          class="home-banner"
          src="assets/banner_1.jpg"
          alt="책상에서 문제를 풀고 있는 캐릭터"
        />
        <p class="eyebrow">AI 생성 예상문제로 가볍게 시작해요</p>
        <h1 id="service-title">하루 5분<br /><span id="home-exam-title">자격증 퀴즈!</span></h1>
        <p class="lead" id="home-description">
          원하는 자격증을 고르고11<br />매일 7문제로 가볍게 준비해요
        </p>

        <div class="selected-exam" id="selected-exam" hidden>
          <span>선택한 자격증</span>
          <strong id="selected-exam-name"></strong>
          <button class="text-button" id="change-exam" type="button">변경</button>
        </div>

        <div class="status-box" aria-live="polite">
          <span class="status-label">오늘의 학습 상태</span>
          <strong class="status-value" id="today-status">학습 전</strong>
        </div>

        <a class="button button-primary button-full" href="quiz.html">
          오늘의 퀴즈 시작
        </a>
        <p class="helper-text">총 7문제 · 약 7분 소요</p>
      </section>
    </main>

    <section class="selection-overlay" id="exam-selection" hidden>
      <div class="selection-panel" role="dialog" aria-modal="true" aria-labelledby="selection-title">
        <p class="eyebrow">학습 자격증 선택</p>
        <h2 id="selection-title">어떤 시험을 준비할까요?</h2>
        <p class="selection-lead">선택한 자격증에 맞춰 오늘의 7문제를 준비해 드려요.</p>
        <div class="exam-options" id="exam-options"></div>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mock-questions.js"></script>
    <script src="js/app.js"></script>
    <script type="module" src="js/background.js"></script>
  </body>
</html>
